name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: skynet_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d skynet_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for this job only. Never reuse real secrets here.
      DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/skynet_ci
      JWT_SECRET_KEY: ci-only-signing-key-not-used-anywhere-else-0001
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and HTTP tests
        run: python -m pytest tests -q
      - name: Migrations apply cleanly on PostgreSQL
        run: alembic upgrade head
      - name: Migrations match the models
        run: alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/*.test.js
      - run: npm run build
